name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --all-features

  agent-relay:
    name: agent-relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      # The committed artifacts under assets/agent-relay/ are built by
      # scripts/build-agent-relay.sh, not by CI: they are not byte-reproducible
      # across rustc versions, so there is nothing to diff against. What CI can
      # check is that the source still compiles for both container
      # architectures, and that nobody edited it without rerunning the script.
      # (Whether the *committed* binary works is checked by the `test` job,
      # which runs the one matching its own architecture.)
      - name: Build the relay for both container architectures
        run: |
          LLD="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/rust-lld"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            RUSTFLAGS="-C linker=$LLD -C link-self-contained=yes" \
              cargo build --release --target "$target" -p agent-relay --bin deck-agent-relay
          done

      # Through the script, not a copy of its pipeline: the two spellings
      # disagreed once already (macOS ships a `sha256` whose output format is
      # not `sha256sum`'s), and a staleness guard that cannot be reproduced
      # locally is worse than none.
      - name: Refuse artifacts older than the source they came from
        run: scripts/build-agent-relay.sh --check
