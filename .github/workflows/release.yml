name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Release ${{ github.ref_name }} already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  meta:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    outputs:
      is_beta: ${{ steps.m.outputs.is_beta }}
      formula_name: ${{ steps.m.outputs.formula_name }}
      formula_class: ${{ steps.m.outputs.formula_class }}
      bin_name: ${{ steps.m.outputs.bin_name }}
    steps:
      - name: Derive channel from tag
        id: m
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            echo "formula_name=deck-beta" >> "$GITHUB_OUTPUT"
            echo "formula_class=DeckBeta" >> "$GITHUB_OUTPUT"
            echo "bin_name=deck-beta" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            echo "formula_name=deck" >> "$GITHUB_OUTPUT"
            echo "formula_class=Deck" >> "$GITHUB_OUTPUT"
            echo "bin_name=deck" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  build:
    needs: [check, verify]
    if: needs.check.outputs.exists != 'true'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Sync crate version to tag
        shell: bash
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          perl -i -pe 'if (!$done && /^version\s*=/) { $_ = "version = \"'"$V"'\"\n"; $done = 1 }' Cargo.toml
          echo "Building with crate version: $(grep -m1 '^version' Cargo.toml)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (ARM Linux targets)
        if: matrix.target == 'aarch64-unknown-linux-musl' || matrix.target == 'armv7-unknown-linux-musleabihf'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl' || matrix.target == 'armv7-unknown-linux-musleabihf'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build binary (cargo)
        if: matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'armv7-unknown-linux-musleabihf'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          BIN=deck
          ARCHIVE="${BIN}-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE}"
          cp "target/${{ matrix.target }}/release/${BIN}" "${ARCHIVE}/"
          cp README.md "${ARCHIVE}/"
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deck-${{ matrix.target }}
          path: "*.tar.gz"

  release:
    needs: [check, meta, verify, build]
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.is_beta == 'true' }}
          files: "*.tar.gz"

  homebrew:
    needs: [check, meta, release]
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    env:
      TAP_REPO: cross-entropy-ai/homebrew-tap
      REPO_SLUG: cross-entropy-ai/deck
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Compute SHA256 sums
        id: sha
        run: |
          echo "aarch64_darwin=$(sha256sum deck-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64_darwin=$(sha256sum deck-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64_linux=$(sha256sum deck-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "aarch64_linux=$(sha256sum deck-${{ github.ref_name }}-aarch64-unknown-linux-musl.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "armv7_linux=$(sha256sum deck-${{ github.ref_name }}-armv7-unknown-linux-musleabihf.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Repackage the same binaries into Homebrew bottle layout so `brew install`
      # pours instead of "building from source". A source install triggers
      # brew's fatal Xcode-version check, which fails on prerelease macOS.
      # A bottle is just <name>/<version>/bin/<bin> in a tarball -- no `brew bottle` needed.
      - name: Build bottles
        id: bottle
        env:
          VERSION: ${{ github.ref_name }}
          FORMULA_NAME: ${{ needs.meta.outputs.formula_name }}
          BIN_NAME: ${{ needs.meta.outputs.bin_name }}
        run: |
          FORMULA_VERSION="${VERSION#v}"

          # $1 = release target, $2 = bottle tag. Prints the bottle's sha256.
          # Use the OLDEST macOS you support as the tag: brew falls back to an
          # older-macOS bottle on newer macOS, so one tag per arch covers all
          # future releases (see Homebrew's find_older_compatible_tag).
          make_bottle() {
            rm -rf stage pkg
            mkdir -p stage "pkg/${FORMULA_NAME}/${FORMULA_VERSION}/bin"
            tar xzf "deck-${VERSION}-$1.tar.gz" -C stage
            cp "stage/deck-${VERSION}-$1/deck" "pkg/${FORMULA_NAME}/${FORMULA_VERSION}/bin/${BIN_NAME}"
            chmod +x "pkg/${FORMULA_NAME}/${FORMULA_VERSION}/bin/${BIN_NAME}"
            # Filename must be <name>-<version>.<tag>.bottle.tar.gz for a
            # non-ghcr.io root_url (Bottle::Filename#url_encode).
            tar czf "${FORMULA_NAME}-${FORMULA_VERSION}.$2.bottle.tar.gz" -C pkg "${FORMULA_NAME}"
            sha256sum "${FORMULA_NAME}-${FORMULA_VERSION}.$2.bottle.tar.gz" | cut -d' ' -f1
          }

          {
            echo "arm64_darwin=$(make_bottle aarch64-apple-darwin arm64_ventura)"
            echo "x86_64_darwin=$(make_bottle x86_64-apple-darwin ventura)"
            echo "arm64_linux=$(make_bottle aarch64-unknown-linux-musl arm64_linux)"
            echo "x86_64_linux=$(make_bottle x86_64-unknown-linux-musl x86_64_linux)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload bottles to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" ./*.bottle.tar.gz --repo "${REPO_SLUG}" --clobber

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
          FORMULA_NAME: ${{ needs.meta.outputs.formula_name }}
          FORMULA_CLASS: ${{ needs.meta.outputs.formula_class }}
          BIN_NAME: ${{ needs.meta.outputs.bin_name }}
          SHA_AARCH64_DARWIN: ${{ steps.sha.outputs.aarch64_darwin }}
          SHA_X86_64_DARWIN: ${{ steps.sha.outputs.x86_64_darwin }}
          SHA_X86_64_LINUX: ${{ steps.sha.outputs.x86_64_linux }}
          SHA_AARCH64_LINUX: ${{ steps.sha.outputs.aarch64_linux }}
          SHA_ARMV7_LINUX: ${{ steps.sha.outputs.armv7_linux }}
          SHA_BOTTLE_ARM64_DARWIN: ${{ steps.bottle.outputs.arm64_darwin }}
          SHA_BOTTLE_X86_64_DARWIN: ${{ steps.bottle.outputs.x86_64_darwin }}
          SHA_BOTTLE_ARM64_LINUX: ${{ steps.bottle.outputs.arm64_linux }}
          SHA_BOTTLE_X86_64_LINUX: ${{ steps.bottle.outputs.x86_64_linux }}
        run: |
          FORMULA_VERSION="${VERSION#v}"
          BASE_URL="https://github.com/${REPO_SLUG}/releases/download/${VERSION}"

          cat > "${FORMULA_NAME}.rb" << FORMULA
          class ${FORMULA_CLASS} < Formula
            desc "Terminal sidebar for browsing and switching tmux sessions"
            homepage "https://github.com/${REPO_SLUG}"
            version "${FORMULA_VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/deck-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64_DARWIN}"
              else
                url "${BASE_URL}/deck-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_DARWIN}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                if Hardware::CPU.is_32_bit?
                  url "${BASE_URL}/deck-${VERSION}-armv7-unknown-linux-musleabihf.tar.gz"
                  sha256 "${SHA_ARMV7_LINUX}"
                else
                  url "${BASE_URL}/deck-${VERSION}-aarch64-unknown-linux-musl.tar.gz"
                  sha256 "${SHA_AARCH64_LINUX}"
                end
              else
                url "${BASE_URL}/deck-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_X86_64_LINUX}"
              end
            end

            bottle do
              root_url "${BASE_URL}"
              sha256 cellar: :any_skip_relocation, arm64_ventura: "${SHA_BOTTLE_ARM64_DARWIN}"
              sha256 cellar: :any_skip_relocation, ventura:       "${SHA_BOTTLE_X86_64_DARWIN}"
              sha256 cellar: :any_skip_relocation, arm64_linux:   "${SHA_BOTTLE_ARM64_LINUX}"
              sha256 cellar: :any_skip_relocation, x86_64_linux:  "${SHA_BOTTLE_X86_64_LINUX}"
            end

            depends_on "tmux"

            def install
              bin.install "deck" => "${BIN_NAME}"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/${BIN_NAME} --version")
            end
          end
          FORMULA

          git config --global --unset-all credential.helper || true
          git config --system --unset-all credential.helper 2>/dev/null || true
          git config --global credential.helper ""
          git config --global --unset-all "http.https://github.com/.extraheader" || true

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp "${FORMULA_NAME}.rb" "tap/Formula/${FORMULA_NAME}.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA_NAME}.rb"
          git commit -m "${FORMULA_NAME} ${VERSION}"
          git push
